<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mawal - لوحة التحكم</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23040507'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#040507;--sf:#0a0d12;--sf2:#0e1a24;--bd:#172033;--bd2:#1e3a4a;--tx:#eef2f7;--mu:#94a3b8;--cy:#22d3ee;--pk:#f472b6;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse 80% 460px at 50% 0%,rgba(34,211,238,.13),rgba(4,5,7,0) 70%),var(--bg);color:var(--tx);font-family:Tajawal,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;border-bottom:1px solid var(--bd);margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px;font-size:20px;direction:ltr}
.logo i{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--pk))}
.user{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mu)}
.user img{width:32px;height:32px;border-radius:50%}
button,.btn{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:1px solid var(--bd2);border-radius:10px;padding:6px 12px;color:var(--mu)}
.link:hover{color:var(--tx);border-color:var(--cy)}
.primary{display:inline-block;border:0;border-radius:14px;padding:14px 28px;font-weight:800;font-size:18px;color:#04070b;background:linear-gradient(135deg,var(--cy),var(--pk));text-decoration:none}
.primary:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:22px}
.card h2{margin:0 0 16px;font-size:20px;font-weight:800}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.card{min-width:0}
.notice{border:1px solid var(--bd2);background:var(--sf2);border-radius:14px;padding:12px 16px;color:var(--mu);margin-bottom:18px;display:none}
.notice.on{display:block}
.notice.bad{border-color:#7f1d1d;color:var(--bad)}
.login{text-align:center;padding:90px 0}
.login h1{font-size:clamp(30px,6vw,48px);margin:0 0 14px;font-weight:800;background:linear-gradient(90deg,#fff,var(--cy),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.login p{color:var(--mu);font-size:19px;margin:0 0 30px}
.picker{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
select,input[type=text],input[type=number]{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd2);border-radius:12px;padding:10px 14px;min-width:0}
select:focus,input:focus{outline:2px solid var(--cy);outline-offset:1px}
.now{display:flex;gap:18px;flex-wrap:wrap}
.art{width:132px;height:132px;border-radius:18px;background:linear-gradient(160deg,#e6fbff,#38c9ec 60%,#f472b6);display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:14px;overflow:hidden;position:relative;flex:none}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art b{width:5px;border-radius:3px;background:#04070b;opacity:.75;height:18px}
.playing .art b{animation:eq 1s ease-in-out infinite}
.art b:nth-child(2){animation-delay:.2s}.art b:nth-child(3){animation-delay:.4s}.art b:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:10px}50%{height:34px}}
@media(prefers-reduced-motion:reduce){.playing .art b{animation:none}}
.meta{flex:1 1 220px;min-width:0}
.meta .t{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.meta .a{color:var(--mu);margin-top:4px;overflow-wrap:anywhere}
.bar{direction:ltr;margin-top:18px}
.track{height:8px;background:#111827;border-radius:4px;cursor:pointer;position:relative}
.track div{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cy),var(--pk));width:0}
.times{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin-top:6px}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.ic{width:46px;height:46px;border-radius:50%;border:1px solid var(--bd2);background:#111827;display:inline-flex;align-items:center;justify-content:center;transition:border-color .2s,transform .15s}
.ic svg{width:21px;height:21px;fill:currentColor;stroke:currentColor;stroke-width:0}
.ic svg.s{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic:hover:not(:disabled){border-color:var(--cy);transform:translateY(-2px)}
.ic:disabled{opacity:.4;cursor:not-allowed}
.ic.big{width:58px;height:58px;background:linear-gradient(135deg,var(--cy),var(--pk));color:#04070b;border:0}
.ic.on{border-color:var(--cy);color:var(--cy);background:#0b2531}
.vol{display:flex;align-items:center;gap:12px;margin-top:18px;direction:ltr}
.vol svg{width:22px;height:22px;stroke:var(--mu);fill:none;stroke-width:2;stroke-linecap:round}
.vol input{flex:1;accent-color:var(--cy)}
.vol span{width:48px;text-align:right;color:var(--mu);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{border:1px solid var(--bd2);background:transparent;border-radius:999px;padding:6px 14px;color:var(--mu);font-size:14px}
.chip.on{border-color:var(--cy);color:var(--cy);background:#0b2531}
.chip:disabled{opacity:.4;cursor:not-allowed}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;max-height:380px;overflow:auto}
.item{display:flex;align-items:center;gap:10px;background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.item .n{color:var(--mu);width:22px;text-align:center;font-size:13px;flex:none}
.item .x{flex:1;min-width:0}
.item .x b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x small{color:var(--mu)}
.item .d{color:var(--mu);font-size:13px;direction:ltr}
.mini{width:34px;height:34px}
.mini svg{width:16px;height:16px}
.empty{color:var(--mu);padding:10px 2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input[type=text]{flex:1 1 180px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{color:var(--mu);font-size:14px}
.tog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tog input{width:20px;height:20px;accent-color:var(--cy)}
.status{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:#22c55e}
.status.off i{background:var(--bad)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0e1a24;border:1px solid var(--cy);padding:12px 20px;border-radius:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.on{opacity:1}
#toast.bad{border-color:var(--bad)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><i></i>MAWAL</div>
    <div class="user" id="userbox"></div>
  </div>
  <main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const API = 'http://localhost:3000';
const INVITE = 'https://discord.com/oauth2/authorize?client_id=1571912284811427970&permissions=3468288&scope=bot%20applications.commands';
const FILTERS = [['off', 'بدون'], ['bass', 'باس قوي'], ['nightcore', 'نايت كور'], ['8d', '8D'], ['slowed', 'بطيء']];
const ICONS = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg>',
  stop: '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>',
  loop: '<svg class="s" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  shuffle: '<svg class="s" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  auto: '<svg class="s" viewBox="0 0 24 24"><path d="M12 12c-2-2.5-4-4-6-4a4 4 0 0 0 0 8c2 0 4-1.5 6-4zm0 0c2 2.5 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.5-6 4z"/></svg>',
  trash: '<svg class="s" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>',
  vol: '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
};
const $ = s => document.querySelector(s);
const S = { me: null, guilds: [], gid: null, st: null, fetchAt: 0, meta: null, dragging: false, qsig: '' };
const store = {
  get t() { try { return localStorage.getItem('mawal_token'); } catch { return null; } },
  set t(v) { try { v ? localStorage.setItem('mawal_token', v) : localStorage.removeItem('mawal_token'); } catch {} },
  get g() { try { return localStorage.getItem('mawal_guild'); } catch { return null; } },
  set g(v) { try { localStorage.setItem('mawal_guild', v); } catch {} },
};
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const icon = (name, cls, title, onclick, extra) => { const b = el('button', { class: 'ic ' + (cls || ''), title, 'aria-label': title, onclick, type: 'button', ...(extra || {}) }); b.innerHTML = ICONS[name]; return b; };
const safeImg = u => (typeof u === 'string' && /^https:\/\//.test(u)) ? u : null;
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let toastT;
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3500); }

async function api(path, body) {
  const r = await fetch(API + path, { method: body !== undefined ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + store.t, ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}) }, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (r.status === 401) { logout(); throw new Error('auth'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'صار خطأ');
  return j;
}
function logout() { store.t = null; S.me = null; S.gid = null; boot(); }

/* ---------- login ---------- */
function showLogin() {
  $('#userbox').replaceChildren();
  $('#app').replaceChildren(el('div', { class: 'login' },
    el('h1', { text: 'لوحة تحكم موال' }),
    el('p', { text: 'تحكم ببوت الموسيقى من أي مكان: تشغيل، صوت، فلاتر، قوائم، وإعدادات سيرفرك.' }),
    el('a', { class: 'primary', href: API + '/api/login?return=' + encodeURIComponent(location.origin + location.pathname), text: 'تسجيل الدخول بديسكورد' })));
}

/* ---------- app skeleton ---------- */
function buildApp() {
  const app = $('#app');
  const gsel = el('select', { id: 'gsel', 'aria-label': 'السيرفر', onchange: e => selectGuild(e.target.value) });
  const ctr = (n, cls, title, fn) => icon(n, cls, title, fn);
  const now = el('section', { class: 'card', id: 'nowcard' },
    el('h2', { text: 'يشتغل الآن' }),
    el('div', { class: 'now' },
      el('div', { class: 'art', id: 'art' }, el('b'), el('b'), el('b'), el('b')),
      el('div', { class: 'meta' }, el('div', { class: 't', id: 'ntitle', text: '—' }), el('div', { class: 'a', id: 'nauthor' }),
        el('div', { class: 'bar' }, el('div', { class: 'track', id: 'track', onclick: seekClick }, el('div', { id: 'fill' })),
          el('div', { class: 'times' }, el('span', { id: 'tcur', text: '0:00' }), el('span', { id: 'tlen', text: '0:00' }))))),
    el('div', { class: 'ctrls', id: 'ctrls' },
      ctr('prev', '', 'السابق', () => act('prev')), ctr('play', 'big', 'إيقاف / تشغيل', () => act('pause')),
      ctr('next', '', 'تخطي', () => act('skip')), ctr('stop', '', 'إيقاف وخروج', () => act('stop')),
      ctr('loop', '', 'تكرار', () => act('loop')), ctr('shuffle', '', 'خلط', () => act('shuffle')), ctr('auto', '', 'تشغيل تلقائي', () => act('autoplay'))),
    el('div', { class: 'vol' }, (() => { const s = el('span'); s.innerHTML = ICONS.vol; return s.firstChild; })(),
      el('input', { type: 'range', id: 'vol', min: 1, max: 150, value: 80, 'aria-label': 'الصوت', oninput: e => $('#volv').textContent = e.target.value + '%', onchange: e => act('volume', e.target.value), onpointerdown: () => S.dragging = true, onpointerup: () => S.dragging = false }),
      el('span', { id: 'volv', text: '80%' })),
    el('div', { class: 'chips', id: 'chips' }, FILTERS.map(([k, n]) => el('button', { class: 'chip', type: 'button', 'data-k': k, text: n, onclick: () => act('filter', k) }))));
  const queue = el('section', { class: 'card' }, el('h2', { text: 'قائمة الانتظار' }), el('div', { class: 'list', id: 'qlist' }),
    el('div', { class: 'row', style: 'margin-top:12px' }, el('button', { class: 'link', id: 'qclear', type: 'button', text: 'مسح القائمة', onclick: () => act('clear') })));
  const add = el('section', { class: 'card' }, el('h2', { text: 'أضف أغنية' }),
    el('div', { class: 'row' }, el('input', { type: 'text', id: 'q', placeholder: 'اسم الأغنية أو الرابط', maxlength: 200, 'aria-label': 'اسم الأغنية', onkeydown: e => { if (e.key === 'Enter') addSong(); } }),
      el('button', { class: 'primary', id: 'addbtn', type: 'button', text: 'شغّل', onclick: addSong, style: 'padding:10px 22px;font-size:16px' })));
  const pl = el('section', { class: 'card' }, el('h2', { text: 'قوائمي المحفوظة' }), el('div', { class: 'list', id: 'pl' }),
    el('div', { class: 'row', style: 'margin-top:12px' }, el('input', { type: 'text', id: 'plname', placeholder: 'اسم لحفظ القائمة الحالية', maxlength: 30, 'aria-label': 'اسم القائمة' }),
      el('button', { class: 'link', type: 'button', text: 'احفظ الحالية', onclick: () => plOp('save', $('#plname').value) })));
  const sets = el('section', { class: 'card hide', id: 'setcard' }, el('h2', { text: 'إعدادات السيرفر' }),
    el('div', { class: 'field' }, el('label', { for: 'sdj', text: 'دور DJ' }), el('select', { id: 'sdj' })),
    el('div', { class: 'field' }, el('label', { for: 'svol', text: 'الصوت الافتراضي (1 - 150)' }), el('input', { type: 'number', id: 'svol', min: 1, max: 150 })),
    el('div', { class: 'field' }, el('label', { for: 'smc', text: 'روم الموسيقى (حصر الأوامر)' }), el('select', { id: 'smc' })),
    el('div', { class: 'field' }, el('label', { for: 'src', text: 'روم الطلبات' }), el('select', { id: 'src' })),
    el('div', { class: 'tog' }, el('input', { type: 'checkbox', id: 'salw' }), el('label', { for: 'salw', text: 'وضع 24/7 (يبقى بالروم)' })),
    el('button', { class: 'primary', type: 'button', text: 'احفظ الإعدادات', style: 'padding:10px 22px;font-size:16px', onclick: saveSettings }));
  app.replaceChildren(
    el('div', { class: 'notice', id: 'notice' }),
    el('div', { class: 'picker' }, el('label', { for: 'gsel', text: 'السيرفر:' }), gsel, el('span', { class: 'status', id: 'conn' }, el('i'), el('span', { text: 'متصل' }))),
    el('div', { class: 'grid' }, el('div', { class: 'stack' }, now, queue), el('div', { class: 'stack' }, add, pl, sets)));
}

/* ---------- data flow ---------- */
async function loadGuilds() {
  const r = await api('/api/guilds');
  S.guilds = r.guilds;
  const gsel = $('#gsel'); if (!gsel) return;
  gsel.replaceChildren(...S.guilds.map(g => el('option', { value: g.id, text: g.name + (g.playing ? '  ▶' : '') })));
  if (!S.guilds.length) { setNotice('ما لكيت سيرفرات مشتركة بينك وبين البوت. ضيف البوت لسيرفرك أول.', true); return; }
  const want = S.guilds.some(g => g.id === S.gid) ? S.gid : (S.guilds.some(g => g.id === store.g) ? store.g : S.guilds[0].id);
  gsel.value = want;
  if (want !== S.gid) await selectGuild(want);
}
async function selectGuild(id) {
  S.gid = id; store.g = id; S.st = null; S.meta = null;
  $('#qlist').replaceChildren(); S.qsig = '';
  await Promise.all([poll(), loadPlaylists(), loadMeta()]);
}
async function poll() {
  if (!S.gid) return;
  try {
    const st = await api('/api/guild/' + S.gid + '/state');
    S.st = st; S.fetchAt = Date.now(); paint(st); setConn(true);
  } catch (e) { if (e.message !== 'auth') setConn(false); }
}
async function loadPlaylists() {
  try {
    const r = await api('/api/guild/' + S.gid + '/playlists');
    const box = $('#pl'); if (!box) return;
    box.replaceChildren(...(r.playlists.length ? r.playlists.map(p => el('div', { class: 'item' },
      el('div', { class: 'x' }, el('b', { text: p.name }), el('small', { text: p.count + ' أغنية' })),
      el('button', { class: 'link', type: 'button', text: 'شغّل', onclick: () => plOp('play', p.name) }),
      icon('trash', 'mini', 'حذف القائمة', () => plOp('delete', p.name))
    )) : [el('div', { class: 'empty', text: 'ما عندك قوائم. شغّل كم أغنية واحفظها.' })]));
  } catch (e) {}
}
async function loadMeta() {
  try {
    S.meta = await api('/api/guild/' + S.gid + '/meta');
    fillSettings();
  } catch (e) {}
}
function fillSettings() {
  const st = S.st, m = S.meta; if (!st || !m) return;
  const card = $('#setcard'); card.classList.toggle('hide', !st.you.admin);
  if (!st.you.admin) return;
  const opt = (list, cur, none) => [el('option', { value: '', text: none }), ...list.map(x => el('option', { value: x.id, text: x.name, selected: x.id === cur }))];
  $('#sdj').replaceChildren(...opt(m.roles, st.settings.dj, 'بدون (الكل يتحكم)'));
  $('#smc').replaceChildren(...opt(m.textChannels, st.settings.musicChannel, 'بدون (كل الرومات)'));
  $('#src').replaceChildren(...opt(m.textChannels, st.settings.requestChannel, 'بدون'));
  $('#svol').value = st.settings.volume; $('#salw').checked = st.settings.always;
}
async function saveSettings() {
  try {
    await api('/api/guild/' + S.gid + '/settings', { dj: $('#sdj').value || null, volume: parseInt($('#svol').value, 10), musicChannel: $('#smc').value || null, requestChannel: $('#src').value || null, always: $('#salw').checked });
    toast('انحفظت الإعدادات'); await poll(); fillSettings();
  } catch (e) { toast(e.message, true); }
}
async function act(action, value) {
  try { await api('/api/guild/' + S.gid + '/action', { action, value }); await poll(); } catch (e) { if (e.message !== 'auth') toast(e.message, true); }
}
async function addSong() {
  const i = $('#q'), v = i.value.trim(); if (!v) return;
  $('#addbtn').disabled = true;
  try { const r = await api('/api/guild/' + S.gid + '/play', { query: v }); i.value = ''; toast((r.messages && r.messages[0]) || 'تمت الإضافة'); await poll(); }
  catch (e) { if (e.message !== 'auth') toast(e.message, true); }
  $('#addbtn').disabled = false;
}
async function plOp(op, name) {
  name = (name || '').trim(); if (!name) return toast('اكتب اسم القائمة', true);
  try { const r = await api('/api/guild/' + S.gid + '/playlists', { op, name }); toast((r.messages && r.messages[0]) || 'تم'); await loadPlaylists(); if (op === 'play') await poll(); $('#plname').value = ''; }
  catch (e) { if (e.message !== 'auth') toast(e.message, true); }
}
function seekClick(e) {
  const st = S.st; if (!st || !st.now || !st.you.canControl) return;
  const r = e.currentTarget.getBoundingClientRect();
  act('seek', Math.floor(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * st.now.length));
}

/* ---------- painting ---------- */
function setConn(ok) { const c = $('#conn'); if (!c) return; c.className = 'status' + (ok ? '' : ' off'); c.lastChild.textContent = ok ? 'متصل' : 'انقطع الاتصال بالبوت'; }
function setNotice(t, bad) { const n = $('#notice'); if (!n) return; n.textContent = t || ''; n.className = 'notice' + (t ? ' on' : '') + (bad ? ' bad' : ''); }
function paint(st) {
  const y = st.you, can = y.canControl;
  $('#nowcard').classList.toggle('playing', !!st.now && !st.now.paused);
  const art = $('#art'); art.querySelectorAll('img').forEach(i => i.remove());
  if (st.now) { const u = safeImg(st.now.artwork); if (u) art.prepend(el('img', { src: u, alt: '', referrerpolicy: 'no-referrer' })); }
  $('#ntitle').textContent = st.now ? st.now.title : 'ما اكو شي يشتغل';
  $('#nauthor').textContent = st.now ? st.now.author : 'اكتب اسم أغنية بالأسفل لتبدأ';
  $('#tlen').textContent = st.now ? (st.now.stream ? 'بث مباشر' : fmt(st.now.length)) : '0:00';
  const play = $('#ctrls').children[1]; play.innerHTML = st.now && !st.now.paused ? ICONS.pause : ICONS.play;
  [...$('#ctrls').children].forEach((b, i) => { b.disabled = !can || !st.now && i !== 1 || (!st.now && i === 1); });
  $('#ctrls').children[4].classList.toggle('on', st.loop); $('#ctrls').children[6].classList.toggle('on', st.autoplay);
  if (!S.dragging) { $('#vol').value = st.volume; $('#volv').textContent = st.volume + '%'; }
  $('#vol').disabled = !can || !st.now;
  $('#chips').querySelectorAll('.chip').forEach(c => { c.classList.toggle('on', c.dataset.k === st.filter); c.disabled = !can || !st.now; });
  $('#qclear').disabled = !can || !st.queueTotal;
  $('#addbtn').disabled = !y.inVoice; 
  const sig = JSON.stringify([st.queue.map(q => q.title + q.length), can, st.queueTotal]);
  if (sig !== S.qsig) {
    S.qsig = sig;
    $('#qlist').replaceChildren(...(st.queue.length ? st.queue.map((q, i) => el('div', { class: 'item' },
      el('span', { class: 'n', text: i + 1 }), el('div', { class: 'x' }, el('b', { text: q.title }), el('small', { text: q.author })),
      el('span', { class: 'd', text: fmt(q.length) }),
      can ? icon('trash', 'mini', 'حذف من القائمة', () => act('remove', i)) : null)) : [el('div', { class: 'empty', text: 'القائمة فاضية.' })]));
  }
  if (!y.inVoice) setNotice('ادخل روم صوتي بديسكورد حتى تشغّل وتتحكم.');
  else if (!st.now) setNotice('');
  else if (!can) setNotice(y.sameVoice || y.admin ? 'التحكم لدور DJ بس بهالسيرفر.' : 'لازم تكون بنفس الروم الصوتي مع البوت حتى تتحكم.');
  else setNotice('');
  if (!S.meta) loadMeta(); else if (document.activeElement && !$('#setcard').contains(document.activeElement)) fillSettings();
}
function tick() {
  const st = S.st; if (!st || !st.now) { const f = $('#fill'); if (f) f.style.width = '0'; return; }
  const pos = Math.min(st.now.length, st.now.position + (st.now.paused ? 0 : Date.now() - S.fetchAt));
  $('#fill').style.width = (st.now.stream ? 100 : (pos / Math.max(1, st.now.length)) * 100) + '%';
  $('#tcur').textContent = fmt(pos);
}

/* ---------- boot ---------- */
async function boot() {
  if (location.hash.startsWith('#token=')) { store.t = location.hash.slice(7); history.replaceState(null, '', location.pathname + location.search); }
  if (!store.t) return showLogin();
  try {
    S.me = await api('/api/me');
    const u = $('#userbox'); u.replaceChildren(el('span', { text: S.me.name }), el('button', { class: 'link', type: 'button', text: 'خروج', onclick: logout }));
    buildApp(); await loadGuilds();
  } catch (e) { if (e.message !== 'auth') { $('#app').replaceChildren(el('div', { class: 'login' }, el('h1', { text: 'ما كدرنا نتصل بالبوت' }), el('p', { text: 'تأكد إن البوت شغّال وإنك متصل بالإنترنت.' }), el('button', { class: 'primary', type: 'button', text: 'حاول مرة ثانية', onclick: boot }))); } }
}
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#token=')) boot(); });
setInterval(() => { if (!document.hidden) poll(); }, 2000);
setInterval(() => { if (!document.hidden && S.me) loadGuilds().catch(() => {}); }, 30000);
setInterval(tick, 250);
boot();
</script>
</body>
</html>
